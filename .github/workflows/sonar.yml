name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.sonar/ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
      SONAR_USER_HOME: ${{ github.workspace }}/.sonar/user-home

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Sonar authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the repository Actions secret SONAR_TOKEN before running SonarCloud.'
            exit 1
          fi

      - name: Restore FetchContent dependencies
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent
          key: sonar-v1-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            sonar-v1-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/ccache
          key: sonar-v1-gcc-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-v1-gcc-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-
            sonar-v1-gcc-${{ runner.os }}-${{ runner.arch }}-refs/heads/main-

      - name: Restore Sonar caches
        id: sonar_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .sonar/cfamily-cache
            ${{ github.workspace }}/.sonar/user-home/cache
            ${{ github.workspace }}/.sonar/user-home/sonar-scanner-7.2.0.5079-linux-x64
          key: sonar-v1-analysis-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-v1-analysis-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-
            sonar-v1-analysis-${{ runner.os }}-${{ runner.arch }}-refs/heads/main-

      - name: Install Linux dependencies
        id: install
        run: |
          if ! sudo apt-get update; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache unzip python3-venv xvfb xauth \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxss-dev libxtst-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev
          python3 -m venv /tmp/horo-gcovr
          /tmp/horo-gcovr/bin/pip install --disable-pip-version-check --no-cache-dir \
            coverage==7.6.10 gcovr==8.6 pytest==8.3.4

      - name: Configure and build
        id: build
        run: |
          cmake -S . -B build/sonar -G Ninja -DBUILD_TESTING=ON \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS_DEBUG="--coverage -fprofile-abs-path" \
            -DCMAKE_CXX_FLAGS_DEBUG="--coverage -fprofile-abs-path" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHORO_ENABLE_EDITOR=ON \
            -DHORO_ENABLE_GPU_SMOKE_TESTS=ON \
            -DHORO_ENABLE_TELEMETRY=ON \
            -DHORO_ENABLE_OPENTELEMETRY=ON
          cmake --build build/sonar --parallel

      - name: Test and collect coverage
        id: coverage
        run: |
          xvfb-run -a ctest --test-dir build/sonar --output-on-failure -LE 'gui|editor'
          /tmp/horo-gcovr/bin/coverage run --source=scripts -m pytest tests/python --quiet
          /tmp/horo-gcovr/bin/coverage xml -o build/sonar/python-coverage.xml
          /tmp/horo-gcovr/bin/gcovr --sonarqube build/sonar/coverage.xml \
            --sonarqube-metric line \
            --root "$GITHUB_WORKSPACE" \
            --filter "$GITHUB_WORKSPACE/include" \
            --filter "$GITHUB_WORKSPACE/src" \
            --filter "$GITHUB_WORKSPACE/apps/common" \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --exclude-noncode-lines \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            build/sonar
          ccache --show-stats

      - name: SonarCloud scan
        id: scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.sonar/cfamily-cache" "$SONAR_USER_HOME"
          if [ ! -x "$SONAR_USER_HOME/sonar-scanner-7.2.0.5079-linux-x64/bin/sonar-scanner" ]; then
            curl --retry 3 -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-linux-x64.zip -o /tmp/sonar-scanner.zip
            unzip -q /tmp/sonar-scanner.zip -d "$SONAR_USER_HOME"
          fi
          "$SONAR_USER_HOME/sonar-scanner-7.2.0.5079-linux-x64/bin/sonar-scanner" \
            -Dsonar.organization=docktail \
            -Dsonar.projectKey=abdullahbodur_horo-engine \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json \
            -Dsonar.coverageReportPaths=build/sonar/coverage.xml \
            -Dsonar.python.coverage.reportPaths=build/sonar/python-coverage.xml \
            -Dsonar.cfamily.analysisCache.mode=fs \
            -Dsonar.cfamily.analysisCache.path="$GITHUB_WORKSPACE/.sonar/cfamily-cache" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Save FetchContent dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.compiler.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/ccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}

      - name: Save Sonar caches
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.sonar_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .sonar/cfamily-cache
            ${{ github.workspace }}/.sonar/user-home/cache
            ${{ github.workspace }}/.sonar/user-home/sonar-scanner-7.2.0.5079-linux-x64
          key: ${{ steps.sonar_cache.outputs.cache-primary-key }}
