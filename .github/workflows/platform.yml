name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / Clang
            runner: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows / MSVC
            runner: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Setup MSVC and Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja on Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure, build, and test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/ci --parallel
          cmake -E make_directory build/ci/test-results
          ctest --test-dir build/ci --output-on-failure \
            --output-junit build/ci/test-results/ctest.xml

      - name: Configure, build, and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl
          cmake --build build/ci --parallel
          cmake -E make_directory build/ci/test-results
          ctest --test-dir build/ci --output-on-failure \
            --output-junit build/ci/test-results/ctest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: build/ci/test-results/
          if-no-files-found: ignore
