name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Test · Linux / GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxss-dev libxtst-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev
      - name: Build and test
        env:
          FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
        run: |
          cmake -S . -B build/ci -G Ninja -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/ci --parallel
          cmake -E make_directory build/ci/test-results
          ctest --test-dir build/ci --output-on-failure \
            --output-junit build/ci/test-results/ctest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: build/ci/test-results/
          if-no-files-found: ignore
