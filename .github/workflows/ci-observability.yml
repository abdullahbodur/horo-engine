name: Observability Matrix

on:
  push:
    branches: [main, develop]
    paths:
      - 'include/Horo/Application/HostObservability.h'
      - 'include/Horo/Foundation/Diagnostics/**'
      - 'include/Horo/Foundation/Logging/**'
      - 'include/Horo/Foundation/Telemetry/**'
      - 'src/application/observability/**'
      - 'src/foundation/diagnostics/**'
      - 'src/foundation/logging/**'
      - 'src/foundation/telemetry/**'
      - 'apps/horo-engine/**'
      - 'apps/HoroEditor/app/HoroEditorApp.cpp'
      - 'apps/CMakeLists.txt'
      - 'observability/**'
      - 'scripts/dev.py'
      - 'scripts/requirements.txt'
      - 'tests/python/test_dev_runner.py'
      - 'tests/python/test_grafana_dashboard.py'
      - 'docs/architecture/observability/**'
      - 'tests/benchmarks/TelemetryFastPathBenchmark.cpp'
      - 'tests/unit/application/HostObservabilityTests.cpp'
      - 'tests/unit/foundation/ObservabilityTests.cpp'
      - 'tests/unit/foundation/OpenTelemetrySinkTests.cpp'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/ci-observability.yml'
  pull_request:
    paths:
      - 'include/Horo/Application/HostObservability.h'
      - 'include/Horo/Foundation/Diagnostics/**'
      - 'include/Horo/Foundation/Logging/**'
      - 'include/Horo/Foundation/Telemetry/**'
      - 'src/application/observability/**'
      - 'src/foundation/diagnostics/**'
      - 'src/foundation/logging/**'
      - 'src/foundation/telemetry/**'
      - 'apps/horo-engine/**'
      - 'apps/HoroEditor/app/HoroEditorApp.cpp'
      - 'apps/CMakeLists.txt'
      - 'observability/**'
      - 'scripts/dev.py'
      - 'scripts/requirements.txt'
      - 'tests/python/test_dev_runner.py'
      - 'tests/python/test_grafana_dashboard.py'
      - 'docs/architecture/observability/**'
      - 'tests/benchmarks/TelemetryFastPathBenchmark.cpp'
      - 'tests/unit/application/HostObservabilityTests.cpp'
      - 'tests/unit/foundation/ObservabilityTests.cpp'
      - 'tests/unit/foundation/OpenTelemetrySinkTests.cpp'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/ci-observability.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-2022

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Setup Ninja on Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67

      - name: Install Python test requirements
        shell: bash
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Configure headless matrix entry
        shell: bash
        run: |
          cmake -S . -B build/observability -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DHORO_BUILD_EDITOR_GUI=OFF \
            -DHORO_BUILD_RENDER_OPENGL=OFF \
            -DHORO_BUILD_RENDER_METAL=OFF \
            -DHORO_ENABLE_TELEMETRY=ON \
            -DHORO_ENABLE_OPENTELEMETRY=ON

      - name: Build qualification targets
        shell: bash
        run: |
          targets=(
            HoroObservabilityTests
            HoroHostObservabilityTests
            HoroTelemetryFastPathBenchmark
            HoroFoundationPublicHeaderCompile
            horo-engine
            HoroOpenTelemetryTests
          )
          cmake --build build/observability --parallel --target "${targets[@]}"

      - name: Run observability qualification
        shell: bash
        run: |
          ctest --test-dir build/observability \
            -R 'HoroObservabilityTests|HoroHostObservabilityTests|HoroOpenTelemetryTests|HoroTelemetryFastPathBenchmark|HoroPythonToolingTests' \
            --output-on-failure

      - name: Repeat concurrency and failure isolation stress
        shell: bash
        run: |
          ctest --test-dir build/observability \
            --repeat until-fail:10 \
            -R 'Concurrent producers and shutdown race|Telemetry producers drop from a full bounded queue|Telemetry shutdown reports a bounded timeout|Failing operation history storage|JSONL replacement failures' \
            --output-on-failure
