version: 2.1

jobs:
  sonar:
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen2
    environment:
      CCACHE_BASEDIR: /home/circleci/project
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: /home/circleci/.cache/ccache
      FETCHCONTENT_BASE_DIR: /home/circleci/project/.cmake/fetchcontent
    steps:
      - checkout:
          method: full
      - restore_cache:
          keys:
            - v2-fetchcontent-{{ arch }}-{{ checksum "CMakeLists.txt" }}-{{ checksum "cmake/Dependencies.cmake" }}
            - v2-fetchcontent-{{ arch }}-{{ checksum "CMakeLists.txt" }}-
            - v2-fetchcontent-{{ arch }}-
      - restore_cache:
          keys:
            - v2-ccache-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - v2-ccache-{{ arch }}-{{ .Branch }}-
            - v2-ccache-{{ arch }}-
            - v1-ccache-{{ arch }}-{{ .Branch }}
      - restore_cache:
          keys:
            - v2-sonar-cfamily-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - v2-sonar-cfamily-{{ arch }}-{{ .Branch }}-
            - v2-sonar-cfamily-{{ arch }}-
            - v1-sonar-cfamily-{{ arch }}-{{ .Branch }}
      - run:
          name: Install Linux dependencies
          command: |
            if ! sudo apt-get update; then
              sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
              sudo apt-get update
            fi
            sudo apt-get install -y --no-install-recommends \
              ninja-build ccache unzip \
              libwayland-dev wayland-protocols libxkbcommon-dev \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
              libxext-dev libxss-dev libxtst-dev libxxf86vm-dev \
              libgl1-mesa-dev libglu1-mesa-dev
      - run:
          name: Configure and build
          command: |
            cmake -S . -B build/sonar -G Ninja -DBUILD_TESTING=OFF \
              -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DHORO_ENABLE_EDITOR=ON \
              -DHORO_ENABLE_TELEMETRY=ON \
              -DHORO_ENABLE_OPENTELEMETRY=ON
            cmake --build build/sonar --parallel
            ccache --show-stats
      - save_cache:
          key: v2-fetchcontent-{{ arch }}-{{ checksum "CMakeLists.txt" }}-{{ checksum "cmake/Dependencies.cmake" }}
          paths:
            - .cmake/fetchcontent
      - save_cache:
          key: v2-ccache-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /home/circleci/.cache/ccache
      - run:
          name: SonarCloud scan
          command: |
            curl -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-linux-x64.zip -o /tmp/sonar-scanner.zip
            unzip -q /tmp/sonar-scanner.zip -d /tmp
            /tmp/sonar-scanner-7.2.0.5079-linux-x64/bin/sonar-scanner \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.organization=docktail \
              -Dsonar.projectKey=abdullahbodur_horo-engine \
              -Dsonar.sourceEncoding=UTF-8 \
              -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json \
              -Dsonar.cfamily.cache.enabled=true \
              -Dsonar.cfamily.cache.path=.sonar/cfamily-cache \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.qualitygate.timeout=300
      - save_cache:
          key: v2-sonar-cfamily-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .sonar/cfamily-cache

workflows:
  sonar:
    jobs:
      - sonar:
          context: horo-ci-quality
