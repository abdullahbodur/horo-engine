version: 2.1

# Temporary opt-in fallback while GitHub Actions owns SonarCloud analysis.
parameters:
  run-circleci-sonar:
    type: boolean
    default: false

jobs:
  sonar:
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen2
    retention:
      caches: 1d
    environment:
      CCACHE_BASEDIR: /home/circleci/project
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: /home/circleci/.cache/ccache
      FETCHCONTENT_BASE_DIR: /home/circleci/project/.cmake/fetchcontent
    steps:
      - checkout:
          method: full
      - restore_cache:
          keys:
            - v2-fetchcontent-{{ arch }}-{{ checksum "CMakeLists.txt" }}-{{ checksum "cmake/Dependencies.cmake" }}
            - v2-fetchcontent-{{ arch }}-{{ checksum "CMakeLists.txt" }}-
            - v2-fetchcontent-{{ arch }}-
      - restore_cache:
          keys:
            - v2-ccache-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - v2-ccache-{{ arch }}-{{ .Branch }}-
            - v2-ccache-{{ arch }}-
            - v1-ccache-{{ arch }}-{{ .Branch }}
      - restore_cache:
          keys:
            - v2-sonar-cfamily-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - v2-sonar-cfamily-{{ arch }}-{{ .Branch }}-
            - v2-sonar-cfamily-{{ arch }}-
            - v1-sonar-cfamily-{{ arch }}-{{ .Branch }}
      - run:
          name: Install Linux dependencies
          command: |
            if ! sudo apt-get update; then
              sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
              sudo apt-get update
            fi
            sudo apt-get install -y --no-install-recommends \
              ninja-build ccache unzip python3-venv xvfb xauth \
              libwayland-dev wayland-protocols libxkbcommon-dev \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
              libxext-dev libxss-dev libxtst-dev libxxf86vm-dev \
              libgl1-mesa-dev libglu1-mesa-dev
            python3 -m venv /tmp/horo-gcovr
            /tmp/horo-gcovr/bin/pip install --disable-pip-version-check --no-cache-dir \
              coverage==7.6.10 gcovr==8.6 pytest==8.3.4
      - run:
          name: Configure and build
          command: |
            cmake -S . -B build/sonar -G Ninja -DBUILD_TESTING=ON \
              -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_C_FLAGS_DEBUG="--coverage -fprofile-abs-path" \
              -DCMAKE_CXX_FLAGS_DEBUG="--coverage -fprofile-abs-path" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DHORO_ENABLE_EDITOR=ON \
              -DHORO_ENABLE_GPU_SMOKE_TESTS=ON \
              -DHORO_ENABLE_TELEMETRY=ON \
              -DHORO_ENABLE_OPENTELEMETRY=ON
            cmake --build build/sonar --parallel
            xvfb-run -a ctest --test-dir build/sonar --output-on-failure -LE 'gui|editor'
            /tmp/horo-gcovr/bin/coverage run --source=scripts -m pytest tests/python --quiet
            /tmp/horo-gcovr/bin/coverage xml -o build/sonar/python-coverage.xml
            /tmp/horo-gcovr/bin/gcovr --sonarqube build/sonar/coverage.xml \
              --sonarqube-metric line \
              --root "$CIRCLE_WORKING_DIRECTORY" \
              --filter "$CIRCLE_WORKING_DIRECTORY/include" \
              --filter "$CIRCLE_WORKING_DIRECTORY/src" \
              --filter "$CIRCLE_WORKING_DIRECTORY/apps/common" \
              --exclude-throw-branches \
              --exclude-unreachable-branches \
              --exclude-noncode-lines \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              build/sonar
            ccache --show-stats
      - save_cache:
          key: v2-fetchcontent-{{ arch }}-{{ checksum "CMakeLists.txt" }}-{{ checksum "cmake/Dependencies.cmake" }}
          paths:
            - .cmake/fetchcontent
      - save_cache:
          key: v2-ccache-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /home/circleci/.cache/ccache
      - run:
          name: SonarCloud scan
          command: |
            mkdir -p "$CIRCLE_WORKING_DIRECTORY/.sonar/cfamily-cache"
            curl -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-linux-x64.zip -o /tmp/sonar-scanner.zip
            unzip -q /tmp/sonar-scanner.zip -d /tmp
            /tmp/sonar-scanner-7.2.0.5079-linux-x64/bin/sonar-scanner \
              -Dsonar.organization=docktail \
              -Dsonar.projectKey=abdullahbodur_horo-engine \
              -Dsonar.sourceEncoding=UTF-8 \
              -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json \
              -Dsonar.coverageReportPaths=build/sonar/coverage.xml \
              -Dsonar.python.coverage.reportPaths=build/sonar/python-coverage.xml \
              -Dsonar.cfamily.analysisCache.mode=fs \
              -Dsonar.cfamily.analysisCache.path="$CIRCLE_WORKING_DIRECTORY/.sonar/cfamily-cache" \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.qualitygate.timeout=300
      - save_cache:
          key: v2-sonar-cfamily-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .sonar/cfamily-cache

workflows:
  sonar:
    when: << pipeline.parameters.run-circleci-sonar >>
    jobs:
      - sonar:
          context: horo-ci-quality
